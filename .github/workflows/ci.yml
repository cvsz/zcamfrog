name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            CHANGELOG.md
            ROADMAP.md
            IMPLEMENTATION-CHECKLIST.md
            .github/PULL_REQUEST_TEMPLATE.md
            .github/dependabot.yml
            CamfrogMultiID.sln
            global.json
            src/CamfrogMultiID.Core/CamfrogMultiID.Core.csproj
            src/CamfrogMultiID.Infrastructure/CamfrogMultiID.Infrastructure.csproj
            src/CamfrogMultiID.App/CamfrogMultiID.App.csproj
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

      - name: Check for common secret file names
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret-bearing file is tracked.'
            exit 1
          fi

      - name: Validate YAML syntax
        shell: bash
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}").each { |f| YAML.load_file(f); puts "ok #{f}" }'

      - name: Marker scan
        shell: bash
        run: |
          set -euo pipefail
          # Fails if any production source carries an unfinished-work marker.
          # Docs are not scanned: several of them define or explain the
          # patterns themselves (AGENTS.md, CHANGELOG.md, this workflow,
          # Makefile, docs/troubleshooting.md,
          # docs/META_MASTER_ENGINEERING_PROMPT.md).
          hits="$(grep -rnE 'TODO|FIXME|XXX|HACK|NotImplementedException' \
            --include='*.cs' --include='*.xaml' --include='*.ps1' --include='*.cmd' \
            --exclude-dir=bin --exclude-dir=obj --exclude-dir=.git \
            src scripts tests || true)"
          if [ -n "$hits" ]; then
            echo 'Marker scan found unfinished production code:'
            echo "$hits"
            exit 1
          fi
          echo 'marker scan clean'

  build:
    runs-on: windows-latest
    needs: repository-baseline
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # global.json is authoritative: without it the runner silently uses
          # whichever SDK its image happens to ship, and a newer analyzer set
          # turns new CA rules into build failures that never reproduce locally.
          global-json-file: global.json

      - name: Display .NET info
        shell: pwsh
        run: dotnet --info

      - name: Restore (solution + win-x64 graph)
        shell: pwsh
        run: |
          dotnet restore CamfrogMultiID.sln --verbosity minimal
          dotnet restore src/CamfrogMultiID.App/CamfrogMultiID.App.csproj --force-evaluate -r win-x64

      - name: Verify assets
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "src/CamfrogMultiID.App/obj/project.assets.json")) { throw "project.assets.json missing after restore" }
          Get-ChildItem src/*/obj/project.assets.json | ForEach-Object { Write-Host $_.FullName }

      - name: Build Debug
        shell: pwsh
        run: dotnet build CamfrogMultiID.sln -c Debug --no-restore --verbosity minimal

      - name: Build Release
        shell: pwsh
        run: dotnet build CamfrogMultiID.sln -c Release --no-restore --verbosity minimal

      - name: Verify formatting (.editorconfig)
        shell: pwsh
        run: dotnet format CamfrogMultiID.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Test
        shell: pwsh
        run: dotnet test CamfrogMultiID.sln -c Release --no-build --verbosity normal

      - name: Generate SBOM and package manifest
        shell: pwsh
        run: |
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # The tool is pinned so the SBOM format cannot drift silently.
          dotnet tool install --global cyclonedx --version 6.2.0
          dotnet CycloneDX CamfrogMultiID.sln `
            --output $out `
            --filename app.bom.xml `
            --recursive `
            --exclude-test-projects `
            --exclude-dev
          if (-not (Test-Path -LiteralPath "$out\app.bom.xml")) { throw "SBOM was not generated" }
          # Fail the build if the document is not parseable XML.
          [xml]$bom = Get-Content "$out\app.bom.xml" -Raw
          $components = @($bom.bom.components.component)
          Write-Host "SBOM components: $($components.Count)"
          if ($components.Count -eq 0) { throw "SBOM contains no components" }
          dotnet list CamfrogMultiID.sln package --include-transitive --format json > "$out\packages.json"
          Get-ChildItem $out | Format-Table Name,Length

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish src/CamfrogMultiID.App/CamfrogMultiID.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --no-restore --verbosity minimal
          $exe = "src/CamfrogMultiID.App/bin/Release/net8.0-windows/win-x64/publish/CamfrogMultiID.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Published executable not found: $exe" }
          Write-Host "Published: $exe"
          Get-ChildItem "src/CamfrogMultiID.App/bin/Release/net8.0-windows/win-x64/publish" | Format-Table Name,Length
          (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash | Out-Host

      - name: Verify publish allow-list
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/verify-publish.ps1 -PublishDir "src/CamfrogMultiID.App/bin/Release/net8.0-windows/win-x64/publish"

      - name: Upload publish artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CamfrogMultiID-win-x64
          path: src/CamfrogMultiID.App/bin/Release/net8.0-windows/win-x64/publish/
          retention-days: 14

      - name: Upload SBOM and package manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: artifacts/
          retention-days: 14
