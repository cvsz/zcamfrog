name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets or sensitive security details. Use SECURITY.md for vulnerabilities."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.2.3 or commit SHA
    validations: {required: true}
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, runtime, browser, deployment mode
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, tokens, private data, and other secrets.
