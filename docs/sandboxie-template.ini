; Sandboxie-Plus Configuration Template for Camfrog Multi-ID Manager
; 
; INSTRUCTIONS:
; 1. Copy this file to %USERPROFILE%\Sandboxie.ini (or let Sandboxie-Plus create it)
; 2. The placeholders below will be auto-replaced by the manager at runtime:
;    %USERNAME%      -> current Windows username
;    %LOCALAPPDATA%  -> C:\Users\<username>\AppData\Local
;    %PROGRAMFILES%  -> C:\Program Files (or C:\Program Files (x86))
;    %SYSTEMROOT%    -> C:\Windows
;    %TEMP%          -> %TEMP% environment variable
;    %SYSTEMROOT%\System32 -> C:\Windows\System32
;
; REFERENCE ONLY - the manager creates boxes via SbieIni ( Enabled=y ) and
; never edits this file. Placeholders below are documentation conventions,
; not substituted values. This file documents the expected structure.

[GlobalSettings]
; Machine-wide Sandboxie settings
; Template=7zipShellEx
; Template=Edge_Fix
; Template=OfficeClickToRun
; Template=OfficeLicensing
; Template=OnScreenKeyboard
; Template=WindowsLive
; Template=WindowsRasMan
; Template=WindowsFontCache

[UserSettings_%SID%]
; Per-user settings (SID = current user's security identifier)
; The manager auto-detects the current user's SID and applies these settings.
SbieCtrl_AutoStartAgent=SandMan.exe -autorun
SbieCtrl_EnableAutoStart=y
BoxGrouping=:DefaultBox,%BOX_SEAZA%,%BOX_NOOM%

; -------------------------------------------------------------------------
; BOX DEFINITIONS (auto-generated by manager for each account)
; -------------------------------------------------------------------------
; The manager creates one box section per Camfrog account.
; Box names are sanitized from the account username (letters, digits, underscore only, max 32 chars).
; 
; Template for each account box:
;
; [BOX_NAME]
; Enabled=y
; BlockNetworkFiles=y
; RecoverFolder=%Desktop%
; RecoverFolder=%Personal%
; RecoverFolder=%{374DE290-123F-4565-9164-39C4925E467B}%
; BorderColor=#00FFFF,ttl
; Template=AutoRecoverIgnore
; Template=LingerPrograms
; Template=BlockPorts
; Template=qWave
; Template=FileCopy
; Template=SkipHook
; Template=OpenBluetooth
; ConfigLevel=10
; 
; Auto-generated box names (examples):
; [Seaza]
; [_oIo_]
; [account123]
; [user_name]

; -------------------------------------------------------------------------
; GLOBAL SETTINGS (applied to all boxes)
; -------------------------------------------------------------------------

[GlobalSettings]
; Network isolation (recommended for multi-account isolation)
BlockNetworkFiles=y

; Template defaults (apply to all boxes unless overridden)
Template=7zipShellEx
Template=Edge_Fix
Template=OfficeClickToRun
Template=OfficeLicensing
Template=OnScreenKeyboard
Template=WindowsLive
Template=WindowsRasMan
Template=WindowsFontCache
Template=7zipShellEx
Template=Edge_Fix
Template=OfficeClickToRun
Template=OfficeLicensing
Template=OnScreenKeyboard
Template=WindowsLive
Template=WindowsRasMan
Template=WindowsFontCache

; Security: block known risky components
Template=BlockPorts
Template=LingerPrograms
Template=qWave
Template=FileCopy
Template=SkipHook
Template=OpenBluetooth
Template=BlockPorts
Template=LingerPrograms
Template=qWave
Template=FileCopy
Template=SkipHook
Template=OpenBluetooth

; -------------------------------------------------------------------------
; RUNTIME VARIABLES (auto-substituted by manager at runtime)
; -------------------------------------------------------------------------
; %BOX_SEAZA%      -> Sanitized box name for account "Seaza"
; %BOX_NOOM%       -> Sanitized box name for account "noom"
; %SANDBOX_ROOT%   -> C:\Sandbox\%USERNAME% (or override via CAMFROGMULTIID_SANDBOX_ROOT)
; %START_EXE%      -> Full path to Sandboxie Start.exe (auto-detected)
; %SBIEINI_EXE%    -> Path to SbieIni.exe (next to Start.exe)
; %CAMFROG_EXE%    -> Full path to Camfrog Video Chat.exe (user-configured)
; %ROOM_URL%       -> camfrog://join_room/?name=ZeaZDev (per account)
; %SANDBOX_ROOT%   -> C:\Sandbox\%USERNAME% (default)

; -------------------------------------------------------------------------
; SANDBOXIE LAUNCH COMMANDS (used by manager)
; -------------------------------------------------------------------------
; 
; CREATE BOX (idempotent):
;   %SbieIniExe% set %BOX_NAME% Enabled y
;
; LAUNCH CLIENT IN BOX:
;   Start.exe /wait /Box:%BOX_NAME% "%CAMFROG_EXE%" --url="%ROOM_URL%"
;
; STOP BOX (graceful shutdown of all processes in box):
;   Start.exe /Box:%BOX_NAME% /terminate
;
; CREATE BOX VIA POWERSHELL (for admin-elevated box creation):
;   powershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand <base64>
;   Where script = "& '{SbieIni.exe}' set %BOX_NAME% Enabled y; exit $LASTEXITCODE"
;   Launched with: Verb = "runas" (UAC prompt)

; -------------------------------------------------------------------------
; SANDBOXIE SERVICE REQUIREMENTS
; -------------------------------------------------------------------------
; The following MUST be present for sandboxed operation:
; 
; 1. Service: SbieSvc (Sandboxie Service)
;    - Must be installed and RUNNING
;    - Check: `sc query SbieSvc` -> STATE = RUNNING
;    - Auto-started by Sandboxie-Plus installer
;    - If missing: Run Sandboxie-Plus installer as Administrator
;
; 2. Driver: SbieDrv
;    - Kernel driver for sandbox isolation
;    - Installed by Sandboxie-Plus installer
;    - Verify: `sc query SbieDrv`
;
; 3. Start.exe
;    - Location: %PROGRAMFILES%\Sandboxie-Plus\Start.exe
;    - Or: %PROGRAMFILES(X86)%\Sandboxie\Start.exe (legacy)
;    - Manager auto-detects at runtime
;
; 4. SbieIni.exe (for box management)
;    - Location: Same directory as Start.exe
;    - Used by manager for box creation/termination

; -------------------------------------------------------------------------
; ACCOUNT-TO-BOX MAPPING (auto-managed)
; -------------------------------------------------------------------------
; Each Camfrog account gets its own sandbox box.
; Mapping: Account Username -> Box Name
;   Seaza      -> Seaza
;   noom       -> _oIo_      (sanitized: letters/digits/underscore only)
;   user_name  -> user_name  (underscores preserved)
;   user.name  -> username   (dots removed)
;   " user "    -> user       (spaces trimmed)
; 
; Max box name length: 32 characters (Sandboxie limit)
; Allowed chars: A-Z, a-z, 0-9, underscore
; Fallback: "account<ID>" if sanitization yields empty string

; -------------------------------------------------------------------------
; MANAGER RUNTIME BEHAVIOR
; -------------------------------------------------------------------------
; On Start Account:
;   1. Check Sandboxie readiness (Start.exe exists, SbieSvc running)
;   2. Ensure box exists: `SbieIni.exe set <BoxName> Enabled y`
;   2. Launch: Start.exe /wait /Box:<BoxName> "Camfrog.exe" --url="camfrog://join_room/?name=ZeaZDev"
;    - /wait keeps Start.exe alive for PID tracking
;    - /Box: isolates in dedicated sandbox
;    - --url= passes room URL to Camfrog client
; On Stop:
;   1. Try graceful: Start.exe /Box:<Name> /terminate
;   2. Fallback: process.Kill(entireProcessTree: true)
;   3. Update DB status to "Stopped"
; 
; Auto-restart logic (opt-in per account):
;   - Max 3 restarts per 10 minutes
;   - On 4th crash within 10 min: pause with Error status
;   - Budget resets on manual Start/Stop

; -------------------------------------------------------------------------
; TROUBLESHOOTING
; -------------------------------------------------------------------------
; Error 3204 "Invalid box name parameter":
;   - Box doesn't exist in config -> Manager auto-creates via SbieIni.exe
;   - Box name has invalid chars -> Sanitize (letters/digits/underscore only)
;   - Config file missing -> Run "Create Boxes For All Accounts" in Settings
;
; Error 2331 (SbieSvc not running):
;   - Service not installed -> Install Sandboxie-Plus as Admin
;   - Service not running -> `sc start SbieSvc` or reboot
;   - Manager auto-attempts `Start-Service SbieSvc` (requires elevation)

; -------------------------------------------------------------------------
; SECURITY NOTES
; -------------------------------------------------------------------------
; - Passwords NEVER in command line, logs, or config files
; - DPAPI (CurrentUser) encrypts secrets at rest
; - Sandboxie isolates: file system, registry, network, IPC
; - Manager runs unelevated; only box creation uses UAC
; - DPAPI blobs in %LOCALAPPDATA%\CamfrogMultiID\secrets\
; - ACL on secrets dir restricted to current user (best effort)